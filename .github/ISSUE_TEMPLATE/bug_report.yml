name: Bug report
description: Create a report to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so the issue can be triaged quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of @cycjimmy/h5-audio-controls you are using.
      placeholder: 6.0.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and how you load the player (ESM import, UMD `<script>` or a CDN URL).
      placeholder: |
        Browser: Chrome 130
        OS: macOS 15
        Integration: ESM import (bundled with Vite)
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior, or a minimal demo (repository / code sandbox) that shows the problem.
      placeholder: |
        1. Call h5AudioControls with '...'
        2. Click the control
        3. See error
      render: text
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: The initialization code, including the options you pass to h5AudioControls(...).
      render: javascript

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Errors from the browser console or the Network tab, if available.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
